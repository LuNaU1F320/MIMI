<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Showdown Live - Interactive API Docs</title>
  <!-- Swagger UI Stylesheet -->
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
  <link rel="shortcut icon" href="https://fastapi.tiangolo.com/img/favicon.png" />
  <style>
    html {
      box-sizing: border-box;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #0f172a; /* Slate 900 background */
      font-family: 'Inter', sans-serif;
    }
    
    /* --- Swagger UI High-Contrast Premium Dark Theme --- */
    .swagger-ui {
      background-color: #0f172a !important;
    }
    
    /* Hide topbar */
    .swagger-ui .topbar {
      display: none !important;
    }
    
    /* Info Block (Header) */
    .swagger-ui .info .title {
      color: #38bdf8 !important; /* Bright Sky Blue */
      font-size: 2.2rem !important;
      font-weight: 800 !important;
    }
    .swagger-ui .info p, 
    .swagger-ui .info li, 
    .swagger-ui .info a {
      color: #cbd5e1 !important; /* Crisp Light Gray */
      font-size: 1rem !important;
    }
    
    /* Section Headers */
    .swagger-ui .opblock-tag {
      color: #f1f5f9 !important;
      border-bottom: 2px solid #334155 !important;
      font-size: 1.3rem !important;
      font-weight: 700 !important;
    }
    .swagger-ui .opblock-tag small {
      color: #94a3b8 !important;
    }
    
    /* Summary Paths and Method Badges */
    .swagger-ui .opblock .opblock-summary-path {
      color: #f1f5f9 !important; /* Ultra high contrast white */
      font-weight: 700 !important;
      font-size: 1.05rem !important;
    }
    .swagger-ui .opblock .opblock-summary-description {
      color: #cbd5e1 !important;
      font-weight: 500 !important;
    }
    .swagger-ui .opblock .opblock-summary-operation-id {
      color: #94a3b8 !important;
    }
    
    /* Method Cards Styling */
    .swagger-ui .opblock.opblock-get {
      background: rgba(14, 165, 233, 0.08) !important;
      border-color: #0ea5e9 !important;
    }
    .swagger-ui .opblock.opblock-get .opblock-summary-method {
      background-color: #0ea5e9 !important;
      color: #ffffff !important;
      font-weight: 700 !important;
    }
    
    .swagger-ui .opblock.opblock-post {
      background: rgba(16, 185, 129, 0.08) !important;
      border-color: #10b981 !important;
    }
    .swagger-ui .opblock.opblock-post .opblock-summary-method {
      background-color: #10b981 !important;
      color: #ffffff !important;
      font-weight: 700 !important;
    }
    
    /* Sections Headers & Descriptions */
    .swagger-ui .opblock .opblock-section-header {
      background: #1e293b !important;
      border-bottom: 1px solid #334155 !important;
    }
    .swagger-ui .opblock .opblock-section-header h4 {
      color: #f1f5f9 !important;
    }
    .swagger-ui .opblock-description-wrapper p {
      color: #cbd5e1 !important;
    }
    
    /* Tables and Parameters */
    .swagger-ui table thead tr th {
      color: #f1f5f9 !important;
      border-bottom: 2px solid #475569 !important;
      font-weight: 700 !important;
    }
    .swagger-ui table tbody tr td {
      color: #e2e8f0 !important;
    }
    .swagger-ui .parameter__name {
      color: #f8fafc !important;
      font-weight: 700 !important;
    }
    .swagger-ui .parameter__name.required:after {
      color: #f43f5e !important; /* Rose Red */
    }
    .swagger-ui .parameter__type {
      color: #38bdf8 !important;
      font-weight: 600 !important;
    }
    .swagger-ui .parameter__in {
      color: #94a3b8 !important;
    }
    
    /* Responses & Codes */
    .swagger-ui .response-col_status {
      color: #f1f5f9 !important;
      font-weight: 700 !important;
    }
    .swagger-ui .response-col_links {
      color: #94a3b8 !important;
    }
    
    /* Inputs, Textareas and Dropdowns */
    .swagger-ui input[type=text], 
    .swagger-ui textarea, 
    .swagger-ui select {
      background-color: #1e293b !important;
      color: #f1f5f9 !important;
      border: 1px solid #475569 !important;
      border-radius: 4px !important;
      padding: 6px 10px !important;
      font-weight: 500 !important;
    }
    .swagger-ui input[type=text]:focus, 
    .swagger-ui textarea:focus {
      outline: none !important;
      border-color: #38bdf8 !important;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2) !important;
    }
    
    /* Buttons */
    .swagger-ui .btn {
      background-color: #334155 !important;
      color: #f1f5f9 !important;
      border: 1px solid #475569 !important;
      border-radius: 4px !important;
      font-weight: 600 !important;
      transition: all 0.2s ease !important;
    }
    .swagger-ui .btn:hover {
      background-color: #475569 !important;
    }
    .swagger-ui .btn.execute {
      background-color: #0ea5e9 !important;
      border: none !important;
      color: #ffffff !important;
      font-size: 1rem !important;
      padding: 8px 20px !important;
    }
    .swagger-ui .btn.execute:hover {
      background-color: #0284c7 !important;
    }
    .swagger-ui .btn.cancel {
      background-color: #ef4444 !important;
      border: none !important;
      color: #ffffff !important;
    }
    .swagger-ui .btn.cancel:hover {
      background-color: #dc2626 !important;
    }
    
    /* Code Blocks, JSON Preview and Models */
    .swagger-ui pre {
      background: #0f172a !important;
      border: 1px solid #334155 !important;
      color: #34d399 !important; /* Emerald Light Green for JSON text */
      font-family: 'Fira Code', 'Courier New', monospace !important;
      border-radius: 6px !important;
      padding: 14px !important;
      font-size: 0.9rem !important;
    }
    .swagger-ui .model-box {
      background-color: #1e293b !important;
      border: 1px solid #334155 !important;
      border-radius: 4px !important;
      padding: 10px !important;
    }
    .swagger-ui .model {
      color: #cbd5e1 !important;
    }
    .swagger-ui .prop-type {
      color: #f43f5e !important;
    }
    .swagger-ui .prop-format {
      color: #64748b !important;
    }
    
    /* Tabs */
    .swagger-ui .tabli button {
      color: #cbd5e1 !important;
      font-weight: 600 !important;
    }
    .swagger-ui .tabli.active button {
      color: #38bdf8 !important;
      border-bottom: 2px solid #38bdf8 !important;
    }
    
    /* Scheme Container */
    .swagger-ui .scheme-container {
      background-color: #1e293b !important;
      box-shadow: none !important;
      border-bottom: 1px solid #334155 !important;
      padding: 15px 30px !important;
    }
    .swagger-ui .scheme-container .title {
      color: #cbd5e1 !important;
    }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>

  <!-- Swagger UI Bundle Scripts -->
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "/openapi.yaml",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "BaseLayout"
      });
      window.ui = ui;
    };
  </script>
</body>
</html>
