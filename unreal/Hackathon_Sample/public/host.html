<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showdown Live Host Dashboard</title>
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/host.css">
</head>
<body>
  <div id="host-app">
    
    <!-- Dashboard Header -->
    <header class="host-header">
      <div class="host-brand">
        <h1 class="host-title">SHOWDOWN LIVE</h1>
        <p class="host-subtitle">발표자 마스터 대시보드</p>
      </div>

      <!-- Live statistics -->
      <div class="host-stats-bar">
        <div class="stat-item">
          <p class="stat-label">현재 상태</p>
          <p class="stat-value" id="game-state-badge">Lobby</p>
        </div>
        <div class="stat-item">
          <p class="stat-label">생존 인원</p>
          <p class="stat-value alive" id="alive-count">0 / 0</p>
        </div>
        <div class="stat-item">
          <p class="stat-label">접속인원 (봇 포함)</p>
          <p class="stat-value" id="total-count">0</p>
        </div>
      </div>
    </header>

    <!-- Main Body Area -->
    <main class="host-body">
      
      <!-- Left Panel: Connection & Control -->
      <section class="host-left-panel">
        
        <!-- Connection QR -->
        <div class="card connection-card">
          <div class="qr-code-wrapper">
            <img id="qr-code-img" src="" alt="QR Code" style="display: none;">
            <p id="qr-placeholder" style="color: var(--text-secondary); font-size: 0.9rem;">주소 생성 중...</p>
          </div>
          <p class="input-label">모바일 접속 주소</p>
          <div class="connection-url" id="connection-url">http://localhost:3000</div>
          <p class="connection-instructions">스마트폰으로 스캔하여 즉시 참여하세요.</p>
        </div>

        <!-- Master Controller Console -->
        <div class="card control-card">
          <h3>마스터 컨트롤러</h3>
          <div class="admin-actions" style="display: flex; flex-direction: column; gap: 8px;">
            <button id="btn-shop" class="btn btn-secondary">상점 개방 (Open Shop)</button>
            <button id="btn-start" class="btn btn-primary">게임 시작 (Start Game)</button>
            <button id="btn-reset" class="btn btn-accent">게임 초기화 (Reset Game)</button>
          </div>
          
          <div class="bot-controls">
            <input type="number" id="bot-count" class="input-field" value="5" min="1" max="50">
            <button id="btn-add-bots" class="btn btn-secondary">봇 추가</button>
          </div>
        </div>

        <!-- Live Votes Panel -->
        <div class="card votes-card" style="margin-top: 20px;">
          <h3>⚡ 실시간 관객 투표 현황 ⚡</h3>
          <div class="vote-stats-container" style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px;">
            <div class="vote-stat-row" style="display: flex; align-items: center; justify-content: space-between;">
              <span style="font-size: 0.9rem; color: var(--text-primary);">💚 힐존 생성</span>
              <span id="vote-count-HealZone" style="font-weight: 700; color: var(--color-mint-text); font-size: 1rem;">0표</span>
            </div>
            <div class="vote-stat-row" style="display: flex; align-items: center; justify-content: space-between;">
              <span style="font-size: 0.9rem; color: var(--text-primary);">⚡ 스피드업</span>
              <span id="vote-count-SpeedUp" style="font-weight: 700; color: var(--color-blue-text); font-size: 1rem;">0표</span>
            </div>
            <div class="vote-stat-row" style="display: flex; align-items: center; justify-content: space-between;">
              <span style="font-size: 0.9rem; color: var(--text-primary);">🔥 자기장 축소</span>
              <span id="vote-count-ShrinkZone" style="font-weight: 700; color: var(--color-peach-text); font-size: 1rem;">0표</span>
            </div>
            <div class="vote-stat-row" style="display: flex; align-items: center; justify-content: space-between;">
              <span style="font-size: 0.9rem; color: var(--text-primary);">📦 보급 투하</span>
              <span id="vote-count-SupplyBox" style="font-weight: 700; color: var(--color-coral-text); font-size: 1rem;">0표</span>
            </div>
          </div>
        </div>

      </section>

      <!-- Right Panel: Players monitoring Grid -->
      <section class="host-right-panel">
        <div class="panel-header">
          <h2 class="panel-title">실시간 플레이어 현황</h2>
          <span id="unreal-connector-status" style="font-size: 0.85rem; color: var(--text-secondary);">언리얼 연결 대기 중</span>
        </div>

        <!-- Live Battle Arena (visible only in Playing state) -->
        <div id="arena-wrapper" style="display: none; padding: 20px 24px; border-bottom: 1px solid var(--bg-tertiary);">
          <div class="arena-title" style="font-family: var(--font-header); font-weight: 700; margin-bottom: 10px; color: var(--text-primary); font-size: 1.1rem; display: flex; align-items: center; gap: 6px;">
            <span style="display: inline-block; width: 8px; height: 8px; background-color: var(--color-peach); border-radius: 50%; animation: pulseBg 1s infinite;"></span>
            실시간 배틀그라운드 (2D Live Preview)
          </div>
          <div class="game-arena" id="game-arena" style="width: 100%; height: 350px; background-color: var(--bg-primary); border: 2px dashed var(--color-blue-border); border-radius: var(--radius-md); position: relative; overflow: hidden; box-shadow: var(--shadow-inset);">
            <!-- Simulated players will be rendered here -->
          </div>
        </div>

        <!-- Winner banner (shown only in Result state) -->
        <div id="winner-banner-wrapper" style="display: none;">
          <div class="winner-banner">
            <div class="winner-crown">👑</div>
            <h2 class="winner-title">FINAL WINNER</h2>
            <p class="winner-name" id="winner-name">Player Name</p>
          </div>
        </div>

        <!-- Players cards container -->
        <div class="players-grid" id="players-grid">
          <!-- Dynamic player card components go here -->
        </div>
      </section>

    </main>

  </div>

  <!-- Socket.io & Logic scripts -->
  <script src="/js/socket-compat.js"></script>
  <script src="/js/host.js"></script>
</body>
</html>
